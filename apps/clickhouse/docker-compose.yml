# Application « ClickHouse » : service + serveur ClickHouse. Depuis ce dossier :
#   cp .env.example .env     # puis renseigner les trois variables
#   docker compose up -d clickhouse
#   docker compose run --rm -v ../../corpus:/corpus agentic ingest /corpus
#   docker compose run --rm agentic ch-selftest      # À FAIRE AVANT USAGE : compare avec le backend mémoire
#   docker compose up -d agentic
services:
  clickhouse:
    # Tag à vérifier sur Docker Hub : 26.3 est une version LTS (support à long terme).
    image: clickhouse/clickhouse-server:26.3
    environment:
      CLICKHOUSE_DB: agentic
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?définissez CLICKHOUSE_PASSWORD}
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  agentic:
    build:
      context: ../..
      dockerfile: apps/clickhouse/Dockerfile
    image: objectagentrag-clickhouse
    env_file: .env
    environment:
      CLICKHOUSE_HOST: clickhouse
    volumes:
      - agentic-data:/data
    ports:
      - "127.0.0.1:8080:8080"        # à exposer derrière un proxy inverse avec TLS si besoin
    depends_on:
      clickhouse:
        condition: service_healthy
    restart: unless-stopped

volumes:
  clickhouse-data:
  agentic-data:
